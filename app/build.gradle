plugins { id 'com.android.application' }

def local = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { local.load(it) }
def publicValue = { String name -> providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrElse(local.getProperty(name, '')) }
// Public client configuration only. Never echo a rejected credential value.
def clientKey = publicValue('AQ_SUPABASE_ANON_KEY')
if (!clientKey.isEmpty() && !clientKey.startsWith('sb_publishable_')) {
    def role = null
    try {
        def pieces = clientKey.split('\\.')
        if (pieces.length == 3) role = new groovy.json.JsonSlurper().parseText(new String(Base64.urlDecoder.decode(pieces[1]), 'UTF-8')).role
    } catch (Exception ignored) { }
    if (role != 'anon') throw new GradleException('AQ_SUPABASE_ANON_KEY must be a public anon/publishable client key. Privileged or unsupported credentials cannot be packaged.')
}
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '') + '"' }
android {
    namespace 'com.aquaquenchers.bms'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aquaquenchers.bms'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
        buildConfigField 'String', 'CLASSIFIER_SHA256', quoted(publicValue('AQ_CLASSIFIER_SHA256'))
        buildConfigField 'String', 'SUPABASE_URL', quoted(publicValue('AQ_SUPABASE_URL'))
        buildConfigField 'String', 'SUPABASE_ANON_KEY', quoted(clientKey)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    // Release signing key lives outside the repository; its settings come from the private Gradle properties.
    signingConfigs {
        release {
            def storeFilePath = providers.gradleProperty('AQ_RELEASE_STORE_FILE').getOrNull()
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword providers.gradleProperty('AQ_RELEASE_STORE_PASSWORD').getOrElse('')
                keyAlias providers.gradleProperty('AQ_RELEASE_KEY_ALIAS').getOrElse('aquaquenchers')
                keyPassword providers.gradleProperty('AQ_RELEASE_KEY_PASSWORD').getOrElse('')
            }
        }
    }
    buildTypes {
        // ALGOCOM: release builds accept only an Owner-reviewed (nonsynthetic) model pinned by AQ_CLASSIFIER_SHA256.
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'ALLOW_SYNTHETIC_MODEL', 'false'
            if (providers.gradleProperty('AQ_RELEASE_STORE_FILE').getOrNull()) signingConfig signingConfigs.release
        }
        // Debug builds may carry the clearly labelled synthetic demo model from src/debug/assets.
        debug {
            buildConfigField 'boolean', 'ALLOW_SYNTHETIC_MODEL', 'true'
            def demo = file('src/debug/assets/expense-model.json')
            if (demo.exists()) buildConfigField 'String', 'CLASSIFIER_SHA256', quoted(java.security.MessageDigest.getInstance('SHA-256').digest(demo.bytes).encodeHex().toString())
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
    // Explicit synthetic parity fixtures belong only to the instrumentation APK.
    sourceSets { androidTest.assets.srcDir rootProject.file('classifier/fixtures') }
}
dependencies { implementation project(':classifier-java'); implementation 'com.google.zxing:core:3.5.3';testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
